# Nixpacks configuration for Dokploy
# Preserves uploaded products data

[phases.setup]
nixPkgs = ["nodejs_22", "curl"]

[phases.build]
# Copy data with products to build output
cmds = [
  "npm run build",
  "cp -r data .next/standalone/ 2>/dev/null || mkdir -p .next/standalone/data && cp data/products.json .next/standalone/data/ 2>/dev/null; echo 'Data copied'"
]

[start]
# Ensure data directory exists with products
cmd = "mkdir -p /app/data && if [ ! -f /app/data/products.json ]; then cp -r /app/.next/standalone/data/* /app/data/ 2>/dev/null || echo '[]' > /app/data/products.json; fi && npm start"

[env]
NODE_ENV = "production"
PORT = "3000"
DATA_DIR = "/app/data"
NEXT_TELEMETRY_DISABLED = "1"
