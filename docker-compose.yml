version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - NEXT_TELEMETRY_DISABLED=1
      - UPLOAD_DIR=/app/uploads/products
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-cansan2024}
      - DATA_DIR=/app/data
      - MAINTENANCE_MODE=${MAINTENANCE_MODE:-false}
      - MAINTENANCE_PASSWORD=${MAINTENANCE_PASSWORD:-cansan2024}
    volumes:
      - uploads_data:/app/uploads
      - data_volume:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  uploads_data:
  data_volume:
