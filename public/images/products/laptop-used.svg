<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" fill="none">
  <rect width="280" height="200" fill="#fafaf8"/>
  <!-- Screen back – slightly warmer/aged silver -->
  <rect x="40" y="28" width="200" height="130" rx="8" fill="#d4d0c8" stroke="#b5b0a0" stroke-width="1.5"/>
  <!-- Screen bezel -->
  <rect x="44" y="32" width="192" height="122" rx="5" fill="#2a2a28"/>
  <!-- Screen display -->
  <rect x="50" y="38" width="180" height="110" rx="3" fill="#2d4a2a"/>
  <!-- Screen UI chrome -->
  <rect x="50" y="38" width="180" height="14" rx="3" fill="#1e331c"/>
  <!-- Traffic lights (muted) -->
  <circle cx="63" cy="45" r="4" fill="#c44a42"/>
  <circle cx="76" cy="45" r="4" fill="#c49a25"/>
  <circle cx="89" cy="45" r="4" fill="#1f9a32"/>
  <!-- Content lines -->
  <rect x="58" y="62" width="90" height="5" rx="2" fill="white" opacity="0.2"/>
  <rect x="58" y="72" width="130" height="4" rx="2" fill="white" opacity="0.13"/>
  <rect x="58" y="81" width="110" height="4" rx="2" fill="white" opacity="0.13"/>
  <rect x="58" y="90" width="80" height="4" rx="2" fill="white" opacity="0.1"/>
  <!-- Subtle wear marks on lid -->
  <line x1="120" y1="50" x2="125" y2="55" stroke="#b5b0a0" stroke-width="0.8" opacity="0.6"/>
  <line x1="160" y1="80" x2="162" y2="86" stroke="#b5b0a0" stroke-width="0.6" opacity="0.5"/>
  <!-- Hinge (slightly worn) -->
  <rect x="40" y="157" width="200" height="5" rx="2.5" fill="#a8a090"/>
  <!-- Base/keyboard (warmer tone) -->
  <rect x="30" y="161" width="220" height="28" rx="6" fill="#d4d0c8" stroke="#b5b0a0" stroke-width="1.5"/>
  <!-- Keys -->
  <rect x="52" y="167" width="8" height="5" rx="1.5" fill="#b5b0a0"/>
  <rect x="63" y="167" width="8" height="5" rx="1.5" fill="#b5b0a0"/>
  <rect x="74" y="167" width="8" height="5" rx="1.5" fill="#b5b0a0"/>
  <rect x="85" y="167" width="8" height="5" rx="1.5" fill="#b5b0a0"/>
