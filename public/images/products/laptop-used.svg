  <rect x="107" y="167" width="8" height="5" rx="1.5" fill="#b5b0a0"/>
  <rect x="118" y="167" width="8" height="5" rx="1.5" fill="#b5b0a0"/>
  <rect x="129" y="167" width="8" height="5" rx="1.5" fill="#b5b0a0"/>
  <rect x="140" y="167" width="8" height="5" rx="1.5" fill="#b5b0a0"/>
  <rect x="151" y="167" width="8" height="5" rx="1.5" fill="#b5b0a0"/>
  <rect x="162" y="167" width="8" height="5" rx="1.5" fill="#b5b0a0"/>
  <rect x="173" y="167" width="16" height="5" rx="1.5" fill="#b5b0a0"/>
  <rect x="48" y="175" width="16" height="5" rx="1.5" fill="#b5b0a0"/>
  <rect x="67" y="175" width="8" height="5" rx="1.5" fill="#b5b0a0"/>
  <rect x="78" y="175" width="8" height="5" rx="1.5" fill="#b5b0a0"/>
  <rect x="89" y="175" width="8" height="5" rx="1.5" fill="#b5b0a0"/>
  <rect x="100" y="175" width="8" height="5" rx="1.5" fill="#b5b0a0"/>
  <rect x="111" y="175" width="8" height="5" rx="1.5" fill="#b5b0a0"/>
  <rect x="122" y="175" width="8" height="5" rx="1.5" fill="#b5b0a0"/>
  <rect x="133" y="175" width="8" height="5" rx="1.5" fill="#b5b0a0"/>
  <rect x="144" y="175" width="8" height="5" rx="1.5" fill="#b5b0a0"/>
  <rect x="155" y="175" width="8" height="5" rx="1.5" fill="#b5b0a0"/>
  <rect x="166" y="175" width="22" height="5" rx="1.5" fill="#b5b0a0"/>
