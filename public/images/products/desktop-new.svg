<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" fill="none">
  <rect width="280" height="200" fill="#f5f5f7"/>
  <!-- Monitor outer frame -->
  <rect x="20" y="20" width="160" height="118" rx="8" fill="#1c1c1e" stroke="#3a3a3c" stroke-width="1.5"/>
  <!-- Screen -->
  <rect x="26" y="26" width="148" height="106" rx="4" fill="#1a3a8f"/>
  <!-- Screen taskbar -->
  <rect x="26" y="118" width="148" height="14" rx="0" fill="#0f2460"/>
  <!-- Screen icons in taskbar -->
  <circle cx="40" cy="125" r="4" fill="white" opacity="0.4"/>
  <circle cx="53" cy="125" r="4" fill="white" opacity="0.4"/>
  <circle cx="66" cy="125" r="4" fill="white" opacity="0.4"/>
  <!-- Desktop UI window -->
  <rect x="34" y="34" width="80" height="55" rx="3" fill="#0f2460" stroke="white" stroke-width="0.5" stroke-opacity="0.15"/>
  <rect x="34" y="34" width="80" height="10" rx="3" fill="#1a50a8"/>
  <rect x="38" y="51" width="45" height="3" rx="1" fill="white" opacity="0.2"/>
  <rect x="38" y="58" width="60" height="3" rx="1" fill="white" opacity="0.15"/>
  <rect x="38" y="65" width="50" height="3" rx="1" fill="white" opacity="0.15"/>
  <!-- Side icons -->
  <rect x="125" y="34" width="40" height="36" rx="3" fill="#0f2460" opacity="0.6"/>
  <rect x="130" y="39" width="30" height="8" rx="2" fill="white" opacity="0.15"/>
  <rect x="130" y="51" width="30" height="8" rx="2" fill="white" opacity="0.12"/>
  <!-- Monitor stand neck -->
  <rect x="87" y="138" width="26" height="22" rx="3" fill="#3a3a3c"/>
  <!-- Monitor stand base -->
  <rect x="65" y="158" width="70" height="10" rx="5" fill="#3a3a3c"/>
  <!-- Tower PC case -->
  <rect x="196" y="48" width="58" height="120" rx="6" fill="#e2e2e7" stroke="#c7c7cc" stroke-width="1.5"/>
  <!-- Tower front panel -->
  <rect x="201" y="56" width="48" height="70" rx="3" fill="#d1d1d6"/>
  <!-- DVD/slot -->
  <rect x="206" y="62" width="38" height="8" rx="2" fill="#b0b0b8"/>
  <!-- USB ports -->
  <rect x="206" y="75" width="8" height="5" rx="1" fill="#b0b0b8"/>
  <rect x="218" y="75" width="8" height="5" rx="1" fill="#b0b0b8"/>
  <!-- Power button -->
  <circle cx="225" cy="110" r="8" fill="#d1d1d6" stroke="#c7c7cc" stroke-width="1.5"/>
  <circle cx="225" cy="110" r="4" fill="#1a3a8f" opacity="0.8"/>
  <!-- LED indicator -->
  <circle cx="225" cy="130" r="2.5" fill="#27c93f"/>
  <!-- Ventilation slots -->
  <line x1="206" y1="140" x2="244" y2="140" stroke="#b0b0b8" stroke-width="1.5"/>
  <line x1="206" y1="145" x2="244" y2="145" stroke="#b0b0b8" stroke-width="1.5"/>
  <line x1="206" y1="150" x2="244" y2="150" stroke="#b0b0b8" stroke-width="1.5"/>
</svg>
