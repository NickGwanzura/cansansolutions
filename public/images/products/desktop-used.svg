<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" fill="none">
  <rect width="280" height="200" fill="#fafaf8"/>
  <!-- Monitor outer frame (aged) -->
  <rect x="20" y="20" width="160" height="118" rx="8" fill="#2a2a28" stroke="#4a4a42" stroke-width="1.5"/>
  <!-- Screen -->
  <rect x="26" y="26" width="148" height="106" rx="4" fill="#1e3020"/>
  <!-- Taskbar -->
  <rect x="26" y="118" width="148" height="14" rx="0" fill="#142018"/>
  <!-- Taskbar icons -->
  <circle cx="40" cy="125" r="4" fill="white" opacity="0.3"/>
  <circle cx="53" cy="125" r="4" fill="white" opacity="0.3"/>
  <!-- Windows on screen -->
  <rect x="34" y="34" width="78" height="52" rx="3" fill="#142018" stroke="white" stroke-width="0.5" stroke-opacity="0.1"/>
  <rect x="34" y="34" width="78" height="10" rx="3" fill="#1e4028"/>
  <rect x="38" y="51" width="42" height="3" rx="1" fill="white" opacity="0.15"/>
  <rect x="38" y="58" width="55" height="3" rx="1" fill="white" opacity="0.1"/>
  <!-- Wear marks on monitor -->
  <line x1="45" y1="40" x2="49" y2="45" stroke="#4a4a42" stroke-width="0.8" opacity="0.8"/>
  <!-- Monitor stand -->
  <rect x="87" y="138" width="26" height="22" rx="3" fill="#4a4a42"/>
  <rect x="65" y="158" width="70" height="10" rx="5" fill="#4a4a42"/>
  <!-- Tower PC (aged beige) -->
  <rect x="196" y="48" width="58" height="120" rx="6" fill="#d4d0c4" stroke="#b0aa98" stroke-width="1.5"/>
  <!-- Tower front panel -->
  <rect x="201" y="56" width="48" height="70" rx="3" fill="#c8c4b8"/>
  <!-- DVD slot (aged) -->
  <rect x="206" y="62" width="38" height="8" rx="2" fill="#a8a498"/>
  <!-- USB ports -->
  <rect x="206" y="75" width="8" height="5" rx="1" fill="#a8a498"/>
  <rect x="218" y="75" width="8" height="5" rx="1" fill="#a8a498"/>
  <!-- Power button (worn) -->
  <circle cx="225" cy="110" r="8" fill="#c8c4b8" stroke="#b0aa98" stroke-width="1.5"/>
  <circle cx="225" cy="110" r="4" fill="#4a5a40" opacity="0.7"/>
  <!-- LED indicator (dim) -->
  <circle cx="225" cy="130" r="2.5" fill="#86a840" opacity="0.8"/>
  <!-- Ventilation -->
  <line x1="206" y1="140" x2="244" y2="140" stroke="#a8a498" stroke-width="1.5"/>
  <line x1="206" y1="145" x2="244" y2="145" stroke="#a8a498" stroke-width="1.5"/>
  <line x1="206" y1="150" x2="244" y2="150" stroke="#a8a498" stroke-width="1.5"/>
  <!-- Scratch on tower -->
  <line x1="210" y1="90" x2="215" y2="96" stroke="#b0aa98" stroke-width="0.8" opacity="0.7"/>
  <!-- Pre-owned badge -->
  <rect x="188" y="10" width="74" height="18" rx="9" fill="#d97706"/>
  <text x="225" y="23" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="white" text-anchor="middle">PRE-OWNED</text>
</svg>
