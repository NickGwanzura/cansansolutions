<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120">
  <defs>
    <pattern id="circuit" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <!-- Horizontal traces -->
      <line x1="0" y1="30" x2="40" y2="30" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
      <line x1="80" y1="30" x2="120" y2="30" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
      <line x1="0" y1="90" x2="30" y2="90" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
      <line x1="60" y1="90" x2="120" y2="90" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
      <!-- Vertical traces -->
      <line x1="40" y1="0" x2="40" y2="30" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
      <line x1="40" y1="60" x2="40" y2="120" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
      <line x1="80" y1="0" x2="80" y2="30" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
      <line x1="80" y1="60" x2="80" y2="90" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
      <line x1="30" y1="60" x2="30" y2="90" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
      <!-- Corner joints -->
      <line x1="40" y1="30" x2="80" y2="30" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
      <line x1="30" y1="60" x2="80" y2="60" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
      <!-- Nodes / solder points -->
      <circle cx="40" cy="30" r="2.5" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <circle cx="80" cy="30" r="2.5" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <circle cx="30" cy="90" r="2.5" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <circle cx="80" cy="60" r="2.5" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <!-- IC chip outline -->
      <rect x="44" y="34" width="28" height="18" rx="2" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <!-- Chip pins -->
      <line x1="44" y1="38" x2="40" y2="38" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <line x1="44" y1="43" x2="40" y2="43" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <line x1="44" y1="48" x2="40" y2="48" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <line x1="72" y1="38" x2="76" y2="38" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <line x1="72" y1="43" x2="76" y2="43" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <line x1="72" y1="48" x2="76" y2="48" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <!-- Dot grid -->
      <circle cx="0" cy="0" r="1" fill="rgba(255,255,255,0.06)"/>
      <circle cx="60" cy="0" r="1" fill="rgba(255,255,255,0.06)"/>
      <circle cx="120" cy="0" r="1" fill="rgba(255,255,255,0.06)"/>
      <circle cx="0" cy="60" r="1" fill="rgba(255,255,255,0.06)"/>
      <circle cx="60" cy="60" r="1" fill="rgba(255,255,255,0.06)"/>
      <circle cx="120" cy="60" r="1" fill="rgba(255,255,255,0.06)"/>
      <circle cx="0" cy="120" r="1" fill="rgba(255,255,255,0.06)"/>
      <circle cx="60" cy="120" r="1" fill="rgba(255,255,255,0.06)"/>
      <circle cx="120" cy="120" r="1" fill="rgba(255,255,255,0.06)"/>
    </pattern>
  </defs>
  <rect width="120" height="120" fill="url(#circuit)"/>
</svg>
